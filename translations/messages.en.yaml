            - "Contact and quote request forms"
            - "Service and project presentation pages"
            - "SEO optimization and fast loading"
            - "Modern, responsive interface"
        
        - title: "Context"
          type: "text"
          content: "Project carried out in collaboration with the client to showcase their expertise and generate leads."
        
        - title: "Technologies"
          type: "keyvalue"
          items:
            - key: "Backend"
              value: "Symfony 7 (PHP 8.2)"
            - key: "Frontend"
              value: "Twig, Bootstrap"
            - key: "Hosting"
              value: "OVH shared hosting"
            - key: "Security"
              value: "Honeypot anti-spam"
        
        - title: "Deployment"
          type: "text"
          content: "Deployed on OVH shared hosting, DNS and SSL configured."
      
      conclusion: "The site allows Klimber-Kids to effectively present their products and increase their online visibility."

  dashboard-si:
    title: 'IT Dashboard'
    description: 'An IT Department dashboard integrating Microsoft Graph API, providing centralized management and real-time monitoring of IT resources.'
    details:
      intro: "Dashboard app developed for the UIMM IT department, centralizing management and visualization of IT resources."
      sections:
        - title: "Features"
          type: "list"
          items:
            - "Connects to Microsoft Graph API"
            - "Dynamic display of users, groups, devices"
            - "Custom dashboards"
            - "Real-time stats and charts"
            - "Secure authentication"
        
        - title: "Context"
          type: "text"
          content: "Project completed during an internship at UIMM to improve IT management."
        
        - title: "Technologies"
          type: "keyvalue"
          items:
            - key: "Backend"
              value: "Python (Flask)"
            - key: "Frontend"
              value: "HTML, Bootstrap, Chart.js"
            - key: "API"
              value: "Microsoft Graph"
        
        - title: "Deployment"
          type: "text"
          content: "Deployed on UIMM internal server, access restricted to IT staff."
      
      conclusion: "This dashboard automated IT data collection and visualization, making decision-making easier."

  email-sender:
    title: 'Email Sender'
    description: 'A sophisticated Next.js application for professional email management, featuring marketing campaign capabilities, SMTP configuration management, and real-time email preview.'
    details:
      intro: "Professional email management tool, designed for marketing campaigns and multi-account SMTP management."
      sections:
