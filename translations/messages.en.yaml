projects:
  links:
    view_code: 'View Code'
    visit_website: 'Visit Website'
    live_demo: 'Demo'
  annas-library:
    title: "Anna's Library"
    description: "OPDS server with React web client providing access to Anna's Archive book collection through standardized feeds for e-readers and web browsing."
    details:
      intro: "A modern OPDS (Open Publication Distribution System) server that exposes millions of books from Anna's Archive through standardized catalog feeds, compatible with all major e-reader applications. Includes a beautiful React web interface for browsing and searching the collection."
      sections:
        - title: "Features"
          type: "list"
          items:
            - "OPDS 1.0/2.0 compliant feeds for e-reader integration"
            - "Modern React web interface with TypeScript"
            - "Advanced search by title, author, language, and category"
            - "Multi-language support (English and French)"
            - "Popular books feed by language"
            - "Direct download link resolution"
            - "Category and content type filtering"
            - "OpenSearch description for browser integration"
        
        - title: "Context"
          type: "text"
          content: "Server-based application providing book access through standardized OPDS feeds. Can be self-hosted on any server or local machine for personal use."
        
        - title: "Technologies"
          type: "keyvalue"
          items:
            - key: "Backend"
              value: "Express.js with Node.js"
            - key: "Frontend"
              value: "React 19 with TypeScript"
            - key: "Build Tool"
              value: "Vite for client build"
            - key: "Styling"
              value: "Tailwind CSS"
            - key: "Scraping"
              value: "Cheerio for HTML parsing"
            - key: "Internationalization"
              value: "i18next"
            - key: "Routing"
              value: "React Router for SPA navigation"
            - key: "Icons"
              value: "Lucide React"
        
        - title: "Architecture"
          type: "keyvalue"
          items:
            - key: "Server Layer"
              value: "Express.js generates OPDS XML feeds and provides REST API"
            - key: "Client Layer"
              value: "React SPA for web browsing with server-side rendering fallback"
            - key: "Data Integration"
              value: "Real-time scraping of Anna's Archive with caching"
            - key: "API Design"
              value: "Dual endpoints (OPDS XML for e-readers, JSON API for web)"
        
        - title: "E-reader Compatibility"
          type: "text"
          content: "Works with all OPDS-compatible readers including: Readest, Moon+ Reader, FBReader, Aldiko, KOReader, ReadEra, Calibre, Lithium, and others. Simply add the OPDS feed URL to your e-reader app."
        
        - title: "Deployment"
          type: "list"
          items:
            - "Self-hosted on any Node.js compatible server"
            - "Single command setup: npm install && npm start"
            - "Client pre-built for production with Vite"
            - "Environment variable configuration for customization"
            - "No database required - uses Anna's Archive as data source"
        
        - title: "API Endpoints"
          type: "keyvalue"
          items:
            - key: "/opds"
              value: "Root OPDS catalog"
            - key: "/opds/search"
              value: "Search books with filters"
            - key: "/api/books"
              value: "REST API for web client"
            - key: "/api/popular/:lang"
              value: "Trending books by language"
            - key: "/download/:md5"
              value: "Direct download redirection"
            - key: "/opensearch.xml"
              value: "Browser search plugin"
      
      conclusion: "The project bridges the gap between Anna's Archive's vast collection and standardized e-reader protocols, providing both a beautiful web interface for browsing and OPDS feeds for seamless integration with reading devices. A complete solution for accessing digital books through modern web technologies."
      
  inventory-management:
    title: 'Inventory Management'
    description: "Web application compiled into a Windows executable, built with Next.js, Node.js, and SQLite (later migrated to Tauri v2), featuring reporting and PDF generation capabilities, among others."
    details:
      intro: "Inventory management application developed for SOGEA Environnement (Évreux), installed locally on the warehouse computer. As network deployment was not an option, the app operates autonomously — without Internet access or any remote server."
      sections:
        - title: "Features"
          type: "list"
          items:
            - "Add, edit, and delete items"
            - "Product categorization"
            - "Alert threshold configuration"
            - "Movement history (entries, exits, adjustments)"
            - "Search by name, reference, or category"
            - "PDF export of inventory reports, availability, and invoices — print-ready"
            - "Dropdown menus for predefined fields (sites, managers, cities, etc.)"
            - "Stock valuation using AVCO, FIFO and LIFO methods"
        
        - title: "Context"
          type: "text"
          content: "Local-only deployment (warehouse workstation). No internal server or multi-user access."
        
        - title: "Technologies"
          type: "keyvalue"
          items:
            - key: "Frontend / Backend"
              value: "Next.js with TypeScript"
            - key: "Database"
              value: "SQLite (local file)"
            - key: "Initial version"
              value: "packaged with Electron Builder (~680 MB)"
            - key: "Current version"
              value: "migrated to Tauri v2 (~20 MB)"
            - key: "Interface"
              value: "Native WebView with instant startup (no local Node server required)"
        
        - title: "Key Improvements"
          type: "list"
          items:
            - "Removed local Node.js server → instant launch"
            - "Reduced application size: ~20 MB (down from ~680 MB with Electron)"
            - "Increased security: everything runs locally on the workstation"
            - "Significantly lower memory and CPU usage"
        
        - title: "Compatibility"
          type: "text"
          content: "Windows 10/11. Fully standalone application (no background services required)."
        
        - title: "Deployment"
          type: "text"
          content: "One-click installation via setup.exe generated with Tauri. Everything is bundled (application, SQLite database, interface)."
      
      conclusion: "The project evolved to deliver a simple, fast, and fully autonomous inventory solution — drastically reducing size, dependencies, and startup time. A lightweight and reliable tool perfectly suited for isolated environments."

  klimber_kids:
    title: 'Klimber-Kids'
    description: 'A showcase website for a climbing module manufacturer, highlighting their product range and services with a modern and intuitive interface.'
    details:
      intro: "Showcase website developed for Klimber-Kids, a climbing module manufacturer, to present their range and facilitate contact."
      sections:
        - title: "Features"
