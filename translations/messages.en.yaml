  inventory-management:
    title: 'Inventory Management'
    description: "Web application compiled into a Windows executable, built with Next.js, Node.js, and SQLite (later migrated to Tauri v2), featuring reporting and PDF generation capabilities, among others."
    details: |
      <div class="space-y-4">
        <p>
          Inventory management application developed for <strong>SOGEA Environnement (Évreux)</strong>, installed locally on the warehouse computer.  
          As network deployment was not an option, the app operates autonomously — without Internet access or any remote server.
        </p>

        <table class="table-auto w-full text-left border border-gray-300">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="px-4 py-2 border">Category</th>
              <th class="px-4 py-2 border">Details</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="px-4 py-2 border font-semibold">Features</td>
              <td class="px-4 py-2 border">
                <ul class="list-disc list-inside space-y-1">
                  <li>Add, edit, and delete items</li>
                  <li>Product categorization</li>
                  <li>Alert threshold configuration</li>
                  <li>Movement history (entries, exits, adjustments)</li>
                  <li>Search by name, reference, or category</li>
                  <li>PDF export of inventory reports, availability, and invoices — print-ready</li>
                  <li>Dropdown menus for predefined fields (sites, managers, cities, etc.)</li>
                </ul>
              </td>
            </tr>

            <tr>
              <td class="px-4 py-2 border font-semibold">Context</td>
              <td class="px-4 py-2 border">
                Local-only deployment (warehouse workstation).  
                No internal server or multi-user access.
              </td>
            </tr>

            <tr>
              <td class="px-4 py-2 border font-semibold">Technologies</td>
              <td class="px-4 py-2 border">
                <ul class="list-disc list-inside space-y-1">
                  <li><strong>Frontend / Backend:</strong> Next.js with TypeScript</li>
                  <li><strong>Database:</strong> SQLite (local file)</li>
                  <li><strong>Initial version:</strong> packaged with Electron Builder (~680 MB)</li>
                  <li><strong>Current version:</strong> migrated to <strong>Tauri v2</strong> (~20 MB)</li>
                  <li><strong>Interface:</strong> Native WebView with instant startup (no local Node server required)</li>
                </ul>
              </td>
            </tr>

            <tr>
              <td class="px-4 py-2 border font-semibold">Key Improvements</td>
              <td class="px-4 py-2 border">
                <ul class="list-disc list-inside space-y-1">
                  <li>Removed local Node.js server → instant launch</li>
                  <li>Reduced application size: ~20 MB (down from ~680 MB with Electron)</li>
                  <li>Increased security: everything runs locally on the workstation</li>
                  <li>Significantly lower memory and CPU usage</li>
                </ul>
              </td>
            </tr>

            <tr>
              <td class="px-4 py-2 border font-semibold">Compatibility</td>
              <td class="px-4 py-2 border">
                Windows 10/11. Fully standalone application (no background services required).
              </td>
            </tr>

            <tr>
              <td class="px-4 py-2 border font-semibold">Deployment</td>
              <td class="px-4 py-2 border">
                One-click installation via <code>setup.exe</code> generated with Tauri.  
                Everything is bundled (application, SQLite database, interface).
              </td>
            </tr>
          </tbody>
        </table>

        <p>
          The project evolved to deliver a simple, fast, and fully autonomous inventory solution — drastically reducing size, dependencies, and startup time.  
          A lightweight and reliable tool perfectly suited for isolated environments.
        </p>
      </div>

