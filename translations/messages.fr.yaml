              <td class="px-4 py-2 border">
                <ul class="list-disc list-inside space-y-1">
                  <li>Connexion à Microsoft Graph API</li>
                  <li>Affichage dynamique des utilisateurs, groupes, appareils</li>
                  <li>Tableaux de bord personnalisés</li>
