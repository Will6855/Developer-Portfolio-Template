                  <li>Notifications instantanées</li>
                  <li>Interface mobile-friendly</li>
                </ul>
              </td>
            </tr>
            <tr>
              <td class="px-4 py-2 border font-semibold">Contexte</td>
              <td class="px-4 py-2 border">
                Projet personnel visant à créer un espace ludique et convivial pour jouer à distance.
              </td>
            </tr>
            <tr>
              <td class="px-4 py-2 border font-semibold">Technologies</td>
              <td class="px-4 py-2 border">
                <ul class="list-disc list-inside space-y-1">
                  <li><strong>Frontend :</strong> React, Tailwind CSS</li>
                  <li><strong>Backend :</strong> Node.js, WebSocket</li>
                  <li><strong>Base de données :</strong> MongoDB</li>
                </ul>
              </td>
            </tr>
            <tr>
              <td class="px-4 py-2 border font-semibold">Déploiement</td>
              <td class="px-4 py-2 border">
                Hébergement cloud, accès via navigateur web sur mobile et desktop.
              </td>
            </tr>
          </tbody>
        </table>
        <p>
          Cette application vise à offrir une expérience de jeu fluide et sociale, accessible à tous.
        </p>
