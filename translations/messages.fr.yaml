        </p>
      </div>

  email-sender:
    title: 'Expéditeur d''Emails'
    description: 'Application Next.js sophistiquée pour la gestion d''emails professionnels, incluant des fonctionnalités de campagnes marketing, gestion de configurations SMTP et prévisualisation en temps réel.'
    details: |
      <div class="space-y-4">
