projects:
  links:
    view_code: 'Code Source'
    visit_website: 'Visiter le Site'
    live_demo: 'Démo'
  annas-library:
    title: "La Bibliothèque d'Anna"
    description: "Serveur OPDS avec client web React permettant l'accès à la collection de livres d'Anna's Archive via des flux standardisés pour liseuses et navigation web."
    details:
      intro: "Un serveur OPDS (Open Publication Distribution System) moderne qui expose des millions de livres d'Anna's Archive via des flux de catalogue standardisés, compatibles avec toutes les principales applications de lecture. Inclut une interface web React élégante pour parcourir et rechercher dans la collection."
      sections:
        - title: "Fonctionnalités"
          type: "list"
          items:
            - "Flux OPDS 1.0/2.0 compatibles pour intégration avec liseuses"
            - "Interface web React moderne avec TypeScript"
            - "Recherche avancée par titre, auteur, langue et catégorie"
            - "Support multilingue (anglais et français)"
            - "Flux de livres populaires par langue"
            - "Résolution directe des liens de téléchargement"
            - "Filtrage par catégorie et type de contenu"
            - "Description OpenSearch pour intégration navigateur"
        
        - title: "Contexte"
          type: "text"
          content: "Application serveur fournissant l'accès aux livres via des flux OPDS standardisés. Peut être auto-hébergée sur n'importe quel serveur ou machine locale pour usage personnel."
        
        - title: "Technologies"
          type: "keyvalue"
          items:
            - key: "Backend"
              value: "Express.js avec Node.js"
            - key: "Frontend"
              value: "React 19 avec TypeScript"
            - key: "Outil de build"
              value: "Vite pour la construction client"
            - key: "Stylisation"
              value: "Tailwind CSS"
            - key: "Scraping"
              value: "Cheerio pour l'analyse HTML"
            - key: "Internationalisation"
              value: "i18next"
            - key: "Routing"
              value: "React Router pour la navigation SPA"
            - key: "Icônes"
              value: "Lucide React"
        
        - title: "Architecture"
          type: "keyvalue"
          items:
            - key: "Couche serveur"
              value: "Express.js génère les flux XML OPDS et fournit l'API REST"
            - key: "Couche client"
              value: "SPA React pour la navigation web avec fallback SSR"
            - key: "Intégration données"
              value: "Scraping en temps réel d'Anna's Archive avec cache"
            - key: "Design API"
              value: "Endpoints doubles (XML OPDS pour liseuses, JSON API pour web)"
        
        - title: "Compatibilité liseuses"
          type: "text"
          content: "Fonctionne avec toutes les liseuses compatibles OPDS : Readest, Moon+ Reader, FBReader, Aldiko, KOReader, ReadEra, Calibre, Lithium, et autres. Il suffit d'ajouter l'URL du flux OPDS à votre application de lecture."
        
        - title: "Déploiement"
          type: "list"
          items:
            - "Auto-hébergé sur n'importe quel serveur compatible Node.js"
            - "Installation en une commande : npm install && npm start"
            - "Client pré-construit pour la production avec Vite"
            - "Configuration par variables d'environnement"
            - "Aucune base de données requise - utilise Anna's Archive comme source de données"
        
        - title: "Endpoints API"
          type: "keyvalue"
          items:
            - key: "/opds"
              value: "Catalogue OPDS racine"
            - key: "/opds/search"
              value: "Recherche de livres avec filtres"
            - key: "/api/books"
              value: "API REST pour le client web"
            - key: "/api/popular/:lang"
              value: "Livres tendance par langue"
            - key: "/download/:md5"
              value: "Redirection de téléchargement direct"
            - key: "/opensearch.xml"
              value: "Plugin de recherche navigateur"
      
      conclusion: "Le projet fait le pont entre la vaste collection d'Anna's Archive et les protocoles standardisés des liseuses, fournissant à la fois une interface web élégante pour la navigation et des flux OPDS pour une intégration transparente avec les appareils de lecture. Une solution complète pour accéder aux livres numériques via des technologies web modernes."
      
  inventory-management:
    title: 'Gestion d''Inventaire'
    description: "Application web compilée en un exécutable pour Windows, faite avec Next.js, Node.js et SQLite (puis migrée sur Tauri v2), incluant des fonctionnalités de génération de rapports, etc."
    details:
      intro: "Application de gestion d'inventaire conçue pour SOGEA Environnement (Évreux), installée localement sur le poste du magasinier. Le déploiement réseau ayant été écarté, elle fonctionne en autonomie, sans connexion Internet ni serveur distant."
      sections:
        - title: "Fonctionnalités"
          type: "list"
          items:
            - "Ajout, modification, suppression d'articles"
            - "Catégorisation des produits"
            - "Définition de seuils d'alerte"
            - "Historique des mouvements (entrées, sorties, régularisations)"
            - "Recherches par nom, référence, catégorie"
            - "Export PDF des rapports d'inventaire, des disponibilités et des factures — prêt à l'impression"
            - "Listes déroulantes pour champs prédéfinis (sites, chefs, villes…)"
        
        - title: "Contexte"
          type: "text"
          content: "Déploiement uniquement local (poste magasinier). Pas de serveur interne ni de multi-utilisateur."
        
        - title: "Technologies"
          type: "keyvalue"
          items:
            - key: "Frontend / Backend"
              value: "Next.js avec TypeScript"
            - key: "Base de données"
              value: "SQLite (fichier local)"
            - key: "Version initiale"
              value: "empaquetée avec Electron Builder (~680 Mo)"
            - key: "Version actuelle"
              value: "migrée vers Tauri v2 (~20 Mo)"
            - key: "Interface"
              value: "WebView native avec lancement instantané (plus besoin de serveur Node local)"
        
        - title: "Améliorations clés"
          type: "list"
          items:
            - "Suppression du serveur local Node.js → démarrage immédiat"
            - "Réduction de la taille de l'application : ~20 Mo (contre ~680 Mo sous Electron)"
            - "Exécution plus sécurisée : tout reste en local sur le poste"
            - "Consommation mémoire et CPU fortement réduite"
        
        - title: "Compatibilité"
          type: "text"
          content: "Windows 10/11. Application autonome (aucun service en arrière-plan requis)."
        
        - title: "Déploiement"
          type: "text"
          content: "Installation en un clic via setup.exe généré avec Tauri. Tout est embarqué (application, base SQLite, interface)."
      
      conclusion: "Le projet a évolué pour offrir une gestion simple, rapide et totalement autonome, tout en réduisant drastiquement la taille, les dépendances et le temps de démarrage. Une solution parfaitement adaptée à un environnement isolé."

