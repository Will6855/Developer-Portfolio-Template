  play-with-your-friends:
    title: 'Play With Your Friends'
    description: 'Une application web ludique et interactive pour jouer avec vos amis, offrant une plateforme unique et interactive pour l''interaction sociale.'
    details: |
      <div class="space-y-4">
        <p>
          Plateforme web de jeux multijoueurs pensée pour favoriser l’interaction sociale et le divertissement entre amis.
        </p>
        <table class="table-auto w-full text-left border border-gray-300">
