              <td class="px-4 py-2 border">
                <ul class="list-disc list-inside space-y-1">
                  <li><strong>Backend :</strong> Python (Flask)</li>
                  <li><strong>Frontend :</strong> HTML, Tailwind CSS, Chart.js</li>
